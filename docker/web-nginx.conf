# SPA serving: every path that isn't a real file falls back to index.html so
# client-side routes (/contracts, /reset-password…) survive a refresh.
server {
    # 8080 لا 80: الحاويةُ بغير الجذر (`ق-١٥٨٦`)، ومن ليس جذراً لا يصغي على منفذٍ دون 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable by construction — cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached without revalidation.
    #
    # It shipped with no Cache-Control at all, so browsers applied *heuristic*
    # caching (a fraction of the age since Last-Modified) and served it from
    # disk without asking. That is harmless until a redeploy changes the bundle
    # hash: the stale HTML then requests /assets/index-<OLDHASH>.js, nginx
    # answers 404 because only the new hash exists, no script loads, and the
    # user gets a BLANK PAGE. Worse, an ordinary refresh re-serves the same
    # cached HTML — so the app stays broken until a hard refresh, which is
    # exactly the "الصفحات تتعطّل ولا تعمل حتى بعد التعديل" report.
    #
    # `no-cache` does not mean "don't store": it means "revalidate every time".
    # The ETag still makes that a cheap 304 when nothing changed, so this costs
    # one conditional request per page load and removes the failure mode.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
