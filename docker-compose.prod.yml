# Production stack. Copy .env.production.example to .env.production, fill it,
# then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# TLS is deliberately NOT terminated here — put a reverse proxy (Caddy, nginx,
# or the host platform's load balancer) in front of ports 8080/3000 and give it
# the certificate. Both app ports bind to localhost only for that reason.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 🔴 **من `quay.io` لا من Docker Hub** (`ق-٦٠٠`): السحبُ المجهولُ من Docker Hub صار
    #    يُردّ — **فإعادةُ نشرٍ اليومَ لا تُعيد بناءَ المخزن**، والعطلُ كامنٌ حتى يُحتاج.
    # 🔒 **والوسمُ هو نسخةُ الإنتاج العاملة نفسُها** (قُرئت من الخادم: `minio --version`)
    #    — فلا تُنزَّل درجةً ولا تُرفع بلا قرار، و`latest` يُبدّلها عند كلِّ إقلاع.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    # 9000 على الحلقة المحلية وحدها — الوسيط العاكس هو من يواجه الإنترنت
    # ويحمل الشهادة، تماماً كالواجهة والخادم. بدون هذا لا يصل متصفح العميل
    # إلى روابط التنزيل الموقَّعة. ولوحة الإدارة (9001) تبقى غير منشورة.
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      # القاعدةُ تبقى `service_healthy`: الحاويةُ تُطبّق الهجراتِ عند إقلاعها (`migrate deploy`)، فقاعدةٌ لم تقم بعدُ تُسقطها.
      postgres:
        condition: service_healthy
      # ⚖️ المخزنُ `service_started` لا `service_healthy` (ق-٦٩٤ · 2026-09-13): في بروفة الترقية قِيس التوقفُ `26.8 s`،
      #    منها `13 s` انتظارُ `api` فحصَ صحّة `MinIO` بعد إعادة إنشائه (كلَّ `5 s`) — والهجراتُ `1.55 s` فقط.
      #    و`api` لا يحتاج المخزنَ عند الإقلاع: `FilesService.onModuleInit` يفحص الدلوَ ويُكمل بتحذيرٍ إن تعذّر.
      # ⚠️ والحدُّ معلَن: مخزنٌ لم يقم بعدُ يُنتج فشلاً في **أوّل رفعٍ** لا في الإقلاع — وهو أخفُّ من `13 s` توقّفٍ في كلّ
      #    ترقيةٍ تمسّه. وعلى تثبيتٍ جديد قد يقلع `api` قبل أن يُنشأ الدلو (يُنشئه عند الإقلاع إن وجد المخزن) — فيُعاد
      #    إقلاعُ `api` مرّةً، أو يُنشأ الدلو بيد. ⛔ ولا تُنقل الهجراتُ قبل الاستبدال بدلاً من هذا — فقاعدةٌ أحدثُ من
      #    الشيفرة التي تخدم، ولو ثوانيَ، تُسقط الحاويةَ القديمة عند أوّل عمودٍ يُحذف.
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      # app_user, NOT the postgres superuser — superusers bypass RLS silently
      # and would hollow out tenant isolation's second layer (CLAUDE.md 6.1).
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      WEB_ORIGIN: ${WEB_ORIGIN}
      # الداخلي للرفع والحذف من الخادم…
      S3_ENDPOINT: http://minio:9000
      # …والعام لتوقيع روابط التنزيل التي يفتحها متصفح العميل. اسم `minio` لا
      # يُحلّ خارج شبكة Docker، فبدونه يُرفع كل مرفق ولا يُنزَّل أبداً.
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-mad-app-files}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      # بديله في الكود مفتاح ثابت منشور — وحارس الإقلاع يرفض التشغيل بدونه.
      INTEGRATIONS_ENC_KEY: ${INTEGRATIONS_ENC_KEY}
      # تشفيرُ هويّة الموظف وحسابه ورقم تأميناته في التطبيق (ق-١٣٤٥ · الحزمة م①) — حلقةُ مفاتيح بمعرّفاتها ومفتاحُ
      # بصمةٍ منفصل؛ حارسُ الإقلاع يرفض التشغيل بدونها. وتُحفظ نسختُها خارج الخادم: ضياعُها ضياعُ تلك الحقول.
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS}
      PII_ENCRYPTION_KEY_ID: ${PII_ENCRYPTION_KEY_ID}
      PII_BLIND_INDEX_KEY: ${PII_BLIND_INDEX_KEY}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # حدُّ المزوّد اليوميّ كما تعرضه حجرةُ الحدود (max-emails-day) — مطلوبٌ متى ضُبط SMTP_HOST (ق-١٣٣٣ · ⑬A1).
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-}
      # متتبّعُ الأخطاء (GlitchTip) — فارغاً حتى يوجد خادمُه المستقلّ داخل المملكة؛ شرطُ تشغيل (ق-١٣٣١ · ③).
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEV_SEED_PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME}
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    # ⑪A3 (`ق-١٣١٨`): **الحيُّ غيرُ السليم** — حاويةٌ تُجيب وقاعدتُها ساقطة تبدو حيّةً وهي لا
    # تعمل. فالفحصُ يقرأ `/health` (قاعدةٌ ومخزن) ويحكم **بالرمز** لا بالنصّ.
    # ⚠️ و`start_period` أطولُ من الإقلاع: الهجراتُ تُطبَّق عند القيام، فحكمٌ قبلها يُعيد
    # تشغيلَ الحاوية في أثناء ترحيلها.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

  # Nightly logical backup, keeping the newest 14 dumps. A dump the platform
  # can restore is the operator-side safety net; the merchant-side copy is the
  # in-app JSON export.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # تُقرأ داخل الصدفة ($$) لا عبر مفسّر Compose — فلا بد من تمريرها.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    # كتلة حرفية (|) لا مطوية (>): الصيغة المطوية تحتفظ بأسطر الأسطر الأكثر
    # إزاحة، فكان `-f "..."` ينفصل عن `pg_dump` ويبدأ سطرٌ بـ`&&` — أي خطأ
    # تحليل في sh («syntax error near unexpected token &&») يجعل الحاوية
    # تنهار وتعيد التشغيل بلا نهاية، فلا نسخة احتياطية واحدة تُؤخذ أبداً.
    # و`$$` تمنع Compose من تفسير `$(date …)` قبل أن تصل الصدفة.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        MIN_TABLES=50
        MIN_BYTES=51200
        # ① انتظر اكتمال المخطط قبل أول مقلب. الهجرات تعمل في حاوية api عند
        # كل إقلاع، وpostgres يصير healthy قبلها — فبلا هذا الانتظار تلتقط
        # أول لقطة قاعدةً بلا جدول واحد، ثم تنام يوماً كاملاً. حدث فعلاً:
        # أول نسخة على خادم الاختبار كانت 1.2K وصفر جداول، وتبدو سليمة في ls.
        # انتظارٌ بالشرط لا بـsleep ثابت: لا يخمّن زمن الهجرات.
        until [ "$$(psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" 2>/dev/null || echo 0)" -ge "$$MIN_TABLES" ]; do
          echo "backup: في انتظار اكتمال المخطط قبل أول نسخة..."
          sleep 15
        done
        echo "backup: المخطط جاهز — بدء الدورة"
        # ③ مجلّدُ المقالب لا يقرؤه غيرُ الجذر (ق-٧٢٩): كان `755` فيقرأ أيُّ مستخدمٍ على المضيف
        # مقالبَ القاعدة كاملةً. يُضيَّق هنا كلَّ دورةٍ — فالربطُ يُنشئه `755` إن أُعيد تركيبُه —
        # والقارئان الوحيدان (هذه الحاويةُ والخارجيّة) جذرٌ. مقيسٌ على المنشور 2026-09-14:
        # لا مستخدمَ بشرياً على المضيف، ولا فتحاتٍ، ولا `cron` يقرؤه.
        chmod 700 /backups
        while true; do
          nap=86400
          stamp=$$(date +%Y%m%d-%H%M%S)
          tmp="/backups/mad-app-$$stamp.dump.tmp"
          # pg_dump لا يصدّر الأدوار — دور app_user يُنشئه سكربت التهيئة عند
          # أول إقلاع، فالاستعادة على قاعدة جديدة تمرّ بنفس المسار.
          if pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c -f "$$tmp"; then
            # ② تُفحص **محتويات** المقلب لا حجمه وحده: عدد الجداول من
            # pg_restore -l. نسخة فارغة أسوأ من غياب نسخة لأنها تُطمئن كذباً،
            # ولا تنكشف إلا يوم الحاجة إليها.
            tables=$$(pg_restore -l "$$tmp" 2>/dev/null | grep -c "TABLE " || true)
            bytes=$$(wc -c < "$$tmp")
            if [ "$$tables" -ge "$$MIN_TABLES" ] && [ "$$bytes" -ge "$$MIN_BYTES" ]; then
              # إعادة التسمية بعد النجاح **والتحقق** معاً: مقلبٌ نصفُه مكتوب
              # يبدو صالحاً في القائمة ثم يفشل عند الاستعادة.
              mv "$$tmp" "/backups/mad-app-$$stamp.dump"
              ls -1t /backups/mad-app-*.dump | tail -n +15 | xargs -r rm -f
              echo "backup ok: mad-app-$$stamp.dump ($$tables جدولاً · $$bytes بايت)"
            else
              rm -f "$$tmp"
              echo "backup REJECTED at $$stamp: $$tables جدولاً و$$bytes بايت — دون الحد ($$MIN_TABLES/$$MIN_BYTES). حُذف." >&2
              nap=300
            fi
          else
            rm -f "$$tmp"
            echo "backup FAILED at $$stamp" >&2
            nap=300
          fi
          # المرفوض أو الفاشل يُعاد بعد 5 دقائق لا بعد يوم — وإلا بقيت
          # المنصة بلا نسخة صالحة 24 ساعة بسبب عطلٍ عابر.
          sleep "$$nap"
        done

  # ═══ النسخةُ خارج المضيف (ق-٥٧٣ … ق-٥٧٧) ═══
  #
  # 🔴 **الغرضُ بقاءٌ لا خصوصية**: زوالُ هذا المضيف يُزيل القاعدةَ وأربعَ عشرةَ نسخةً
  #    معها — فما يُبنى في الحفظ والإتلاف يسقط كلُّه بعطلٍ واحد.
  #
  # ⚠️ **ولا تُنتج مقلباً ثانياً**: تشحن ما تحقّقت منه الوظيفةُ المحلّية أعلاه، وتضيف
  #    إليه **الأدوارَ** (لا يصدّرها `pg_dump`) و**مخزنَ الملفّات** و**أسرارَ التشغيل** —
  #    والثلاثةُ لا اثنان (`ق-٥٧٤`): مقلبٌ بلا مفتاحه يُستعاد ولا يُقرأ.
  #
  # ⚠️ **والوجهةُ والمفتاحُ من البيئة لا من الصورة** (`ق-٥٧٣` · `ق-٥٧٥`): `RESTIC_REPOSITORY`
  #    يشير إلى مستودعٍ **داخل المملكة ومن غير مزوّد هذا المضيف**، و`RESTIC_PASSWORD`
  #    عند صاحب المشروع — **ولا يُكتب في ملفٍّ على المضيف** (يُمرَّر عند الإقلاع).
  #
  # ⚠️ **وغيرُ المهيّأة تُعلن نفسَها كلَّ ساعة** ولا تنهار ولا تصمت (`ق-٥٧٧`).
  backup-offsite:
    build:
      context: ./ops/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_KEY:-}
      # المنطقةُ لتوقيع `SigV4` — مزوّدٌ متوافقٌ مع `S3` (أوراكل `me-riyadh-1`) يرفض توقيعاً بمنطقةٍ أخرى.
      AWS_DEFAULT_REGION: ${OFFSITE_REGION:-us-east-1}
      # `1` = مفتاحُ الرفع لا يحذف (سياسةُ الدلو) فلا تقليمَ في الوظيفة اليومية — يُعلَن ولا يصمت (ق-٧٣٤).
      OFFSITE_APPEND_ONLY: ${OFFSITE_APPEND_ONLY:-0}
      BACKUP_HOST: mad-app-prod
    volumes:
      # المقالبُ المحلّية تُقرأ، وملفُّ الحال يُكتب بجانبها.
      - ./backups:/backups
      # مخزنُ الملفّات — **للقراءة فقط**: فيه المختومُ ونسخُ الإغلاق، ولا تكتب فيه وظيفةُ نسخ.
      - minio_data:/minio-data:ro
      # أسرارُ التشغيل — **للقراءة فقط**، وبدونها النسخةُ تُستعاد ولا تُقرأ.
      - ./.env.production:/secrets/.env.production:ro
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        while true; do
          if [ -z "$${RESTIC_REPOSITORY:-}" ] || [ -z "$${RESTIC_PASSWORD:-}" ]; then
            echo "offsite-backup UNCONFIGURED: لا RESTIC_REPOSITORY/RESTIC_PASSWORD — لا نسخةَ خارج المضيف (ق-٥٧٣ · ق-٥٧٥)" >&2
            printf '{"ok":false,"at":"%s","message":"unconfigured"}\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /backups/offsite-status.json || true
            sleep 3600
            continue
          fi
          nap=86400
          /usr/local/bin/offsite-backup.sh || nap=1800
          sleep "$$nap"
        done

volumes:
  postgres_data:
  redis_data:
  minio_data:
