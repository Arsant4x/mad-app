# اختبارات الواجهة — vitest (مكوّنات) + Playwright (متصفح، ثلاثة عروض).
#
# ⛔ vitest تمنع الدمج **من اليوم** — حتمية بلا اعتماد خارجي، فلا عذر لسقوطها.
# ⛔ Playwright تمنع الدمج **من اليوم** أيضاً — قُدِّمت عن 2026-08-17 المخطَّط.
#    كان التأجيل مبنياً على أن حارساً صارماً يُعطَّل عند أول سقوط كاذب فيموت.
#    والتجربة أعطت العكس: وضع الإبلاغ لم يُنقذ حارساً، بل أخفى ستة سقوطات
#    حقيقية وأنتج دمجاً على أساس أخضرَ كاذب. الحارس المؤجَّل هو الذي يموت.
#
# 📌 ولا تُضف `continue-on-error` هنا مجدداً، ولا `| tee` بلا `pipefail`:
#    كلاهما يُخضِّر وظيفةً ساقطة — والثاني أخفى لأنه لا يترك أثراً في الملف.
#
# 🔒 إصدار Node مثبَّت في موضعين — هنا وفي `engines` بكل package.json.
#    السبب حادثة حقيقية: السير كان على 20 والتطوير على 24، فمرّت الاختبارات
#    محلياً وسقطت الخمسة في CI عند التحميل بـ
#    `TypeError: webidl.util.markAsUncloneable is not a function` — jsdom 30
#    يستدعي عبر undici دالةً موجودة في Node 22+ وغائبة في 20. تفاوت البيئتين
#    هو العطل نفسه، فلا يُثبَّت في أحدهما دون الآخر.
name: web-tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - '.github/workflows/web-tests.yml'
      # ⚠️ لازمٌ لا تكميلي: الاختبار ٧ يحرس ترويسات هذا الملف بعينه. وبدونه
      # هنا، تعديلُ إعداد nginx **لا يُشغّل حارسه** — أي أن أخطر تغييرٍ عليه
      # يمرّ بلا فحص، وهو بالضبط التغيير الذي أنتج الصفحة البيضاء أول مرة.
      - 'docker/web-nginx.conf'
      # الترحيلات: الإثبات الحيّ يحرسها، فتعديلها يجب أن يُشغّله.
      - 'apps/api/prisma/migrations/**'

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # --ignore-scripts: ثنائي esbuild يصل عبر optionalDependencies (حزمة
      # المنصة @esbuild/linux-x64)، لا عبر postinstall — فالسكربت احتياطٌ لا
      # حاجة إليه، وتخطّيه يجعل التثبيت حتمياً ويُسكت تحذير allow-scripts.
      # مُتحقَّق منه: npm ci بلا موافقة سكربتات يترك esbuild عاملاً (--version).
      - run: npm ci --ignore-scripts
      # ⛔ vitest **تمنع من اليوم** (قرار المالك 2026-08-11): لا اعتماد خارجي
      # لها — لا قاعدة ولا شبكة ولا متصفح — فلا عذر لسقوطها، ولا معنى لتأجيل
      # صرامةٍ على اختباراتٍ حتمية. (ومنذ 2026-08-12 صارت Playwright مانعةً
      # كذلك، فلم يبقَ في هذا الملف حارسٌ في وضع الإبلاغ.)
      - name: vitest (blocking)
        run: npm run test --workspace apps/web

  # اختبارات الخادم — **كانت غائبة عن السير كلياً حتى 2026-08-13**.
  #
  # 🔴 الاكتشاف: الاستدعاء الوحيد لـ`jest` في هذا الملف كان يسمّي ملفّين
  #    بعينهما (`delegation-log.live` و`task-log.live`). أي أن **92** ملف
  #    اختبار في `apps/api` لم يُنفَّذ في السير قطّ: **15** وحدةً نقيّة في
  #    `src/` (تُشغَّل هنا) و**77** اختبار تكاملٍ في `test/` تحتاج قاعدةً
  #    حيّة (**ما زالت خارج السير** — بند متابعة مسجَّل).
  #
  #    ومن الخمسة عشر:
  #      · `zatca/environment-guard.spec.ts`      (التزام نظامي)
  #      · `integrations/mock-provider-guard.spec.ts` (الثغرة المالية)
  #      · `common/config/production-secrets.spec.ts`
  #      · كل حرّاس المرحلتين الأولى والثانية (التقاطع · الشجرة · الدورات ·
  #        السجل · نموذج المهمة · رؤية المهمة)
  #
  #    كلٌّ منها حارسٌ طُلب صراحةً وأُثبت بالعكس محلياً — ثم لم يُشغَّل حيث
  #    يهمّ. وهو نفس درس الاختبار ٧: **حارسٌ لا يعمل ليس حارساً**، وسقوطه
  #    الذي لا يُرى لا يمنع شيئاً.
  #
  # ⛔ مانعة من أول يوم — لا اعتماد خارجي لها (لا قاعدة ولا شبكة)، فلا عذر.
  api-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # أنواع Prisma فقط — لا اتصال بقاعدة. الاختبارات هنا نقيّة كلها،
      # لكنها تستورد أنواعاً مولَّدة (`@prisma/client`) فتفشل الترجمة بدونها.
      - name: prisma generate (أنواع فقط، بلا قاعدة)
        working-directory: apps/api
        run: npx prisma generate

      # ⚠️ `--roots src` شرطٌ لا تحسين. `testRegex` في package.json هو
      # `.*\.(spec|e2e-spec)\.ts$` — فيلتقط **77** ملفاً في `test/` كلها
      # تحتاج قاعدةً حيّة. تشغيلها هنا يعني 21 مجموعة حمراء لأسبابٍ بيئية،
      # فتُقرأ الوظيفة على أنها عطبٌ في الشيفرة وتُعطَّل خلال أسبوع.
      #
      # النطاق هنا: **الوحدات النقيّة وحدها** — 15 ملفاً في `src/` بلا الحيّة.
      # (والـ77 الأخرى ما زالت خارج السير كلياً — بند متابعة مسجَّل للمالك.)
      - name: jest — وحدات الخادم النقيّة (blocking)
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npx jest --roots '<rootDir>/src' --testPathIgnorePatterns "live\.spec" --verbose 2>&1 | tee /tmp/api-unit.log

      # حارسٌ للحارس: عددُ الملفات المنفَّذة يطابق الموجودة على القرص.
      #
      # ⚠️ يقرأ **القرص** لا مخرَج jest وحده. فنمطٌ يتغيّر (`.spec` ⇒ `.test`)
      # أو ملفٌّ يقع خارج `testMatch` يختفي **صامتاً**: تبقى الوظيفة خضراء
      # وقد نقص حارس. وهي عائلة العطل نفسها التي أخفت هذه الوظيفة سنةً —
      # ولا يكشفها إلا عدٌّ من المصدر.
      - name: التحقق أن كل ملفات الاختبار نُفِّذت فعلاً
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          on_disk=$(find src -name '*.spec.ts' ! -name '*live.spec.ts' | wc -l)
          ran=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/api-unit.log \
            | grep -aoE "Test Suites:.*[0-9]+ total" | grep -aoE "[0-9]+ total" | grep -aoE "^[0-9]+" || echo 0)
          echo "على القرص: $on_disk · نُفِّذ: $ran"
          if [ "$on_disk" != "$ran" ]; then
            echo "::error::تفاوت: $on_disk ملف اختبار على القرص و$ran منفَّذ — حارسٌ سقط خارج نطاق jest"
            exit 1
          fi
          grep -aE "Tests:|Test Suites:" /tmp/api-unit.log || echo "(لا ملخّص)"

  # كل ما يحتاج قاعدةً حيّة — الإثباتُ الحيّ للسجلّات **و**اختبارات التكامل.
  #
  # سُمّيت `append-only-logs-live` حتى 2026-08-13، ثم اتّسع ما تفعله فاتّسع
  # اسمها: وظيفةٌ باسمٍ أضيق ممّا تفعله تُقرأ خطأً — وهي عائلة الخطأ نفسها
  # التي وقعت حين حلّ تعليقُ `nginx-cache` فوق وظيفةٍ أخرى.
  #
  # ## ما تغطّيه
  #
  # ① الإثبات الحيّ لحرّاس `delegation_logs` و`task_logs`.
  #    `delegation-log.spec.ts` يقرأ نصّ الترحيل ويثبت أن المنع **مكتوب** —
  #    وهو لازمٌ لا كافٍ: نصٌّ سليم قد لا يُطبَّق (ترحيلٌ لم يُشغَّل · مُشغِّل
  #    أُسقط لاحقاً · دورٌ يتجاوز السياسة). **وحارس نظامي غير مُختبَر حيّاً
  #    ليس امتثالاً** (قرار المالك 2026-08-12).
  #
  # ② الـ77 اختبار تكامل في `test/` — **كانت خارج السير كلياً** حتى اليوم.
  #    وهي حرّاس المنصّة الفعلية: عزل المستأجر · العقود · الفوترة · ZATCA ·
  #    وضع الدعم · الأرشفة. أُضيفت بقرار المالك 2026-08-13: «حارس لا يُشغَّل
  #    ليس حارساً — وهي قاعدتنا التي بنينا عليها الاختبار السابع».
  #
  # ## لماذا تسلسلياً وبطيئاً
  #
  # `test:e2e` في package.json يحمل `--runInBand` منذ نشأته: 77 مجموعة
  # تتقاسم قاعدةً واحدة، وتوازيها يجعل توكيدات فروق الأرصدة تقرأ كتابةَ
  # مجموعةٍ أخرى. والقرار مُعلَن: **سيرٌ بطيء يمسك أفضل من سريع لا يرى**.
  # خطُّ الأساس المسجَّل على قاعدة نظيفة: 80 مجموعة · 469 اختباراً · 1339 ث.
  #
  # ⛔ مانعة من أول يوم.
  db-integration:
    runs-on: ubuntu-latest
    # سقفٌ لئلا يلتهم تعليقٌ ستّ ساعات. خطّ الأساس 22 دقيقة، والضِّعف هامش.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mad_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: mad_app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mad_app -d mad_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: ci_only_not_a_secret
      # ⚠️ `app_user` لا الدور الخارق: الخارق يتجاوز RLS بصمت، فاختبارٌ
      # يعمل به لا يختبر العزل — ولا يختبر أن السياسة مفروضة (FORCE).
      DATABASE_URL: postgresql://app_user:ci_app_pass@localhost:5432/mad_app?schema=public
      # ⚠️ البذرة ترفض العمل بدونهما (`seed.ts:23`) — وهو تصرّفها الصحيح:
      # حساب مدير منصة بكلمة مرور افتراضية أسوأ من بذرةٍ لا تعمل. نُسيا في
      # أول صياغة فسقطت الوظيفة عند البذرة لا عند الحرّاس، والمخرَج جاء
      # فارغاً — «أحمر» بلا سطر اختبار واحد.
      DEV_SEED_PLATFORM_ADMIN_USERNAME: Arsan_admin
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: CiAdminPass123!

      # ⚠️ ما تحته منقولٌ من `apps/api/.env.test.example` — وهو **مصدر واحد**
      # كُتب من حوادث لا من تخمين. أُضيعت أربع دورات تشغيل (~ساعة ونصف) على
      # تفاوت هذه المتغيّرات بين البيئات، وكل سقوطٍ منها بدا **عطلاً في
      # المنصة** حتى فُحص. فلا يُنقص منها شيء بلا قراءة الملف.
      JWT_ACCESS_SECRET: test-jwt-secret-not-used-outside-tests-0123456789
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      WEB_ORIGIN: http://localhost:5173
      # ⚠️ غيابه يجعل `/zatca/onboarding/start` يرتدّ بـ400 فتسقط ثلاث
      # مجموعات بسببٍ يبدو منطقياً وليس كذلك.
      SECRETS_ENCRYPTION_KEY: test-secrets-key-at-least-32-characters-long
      # ⚠️ بلا MinIO يرتدّ رفع الشعار بـ500 وتسقط `company-profile`.
      S3_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY: mad_app
      S3_SECRET_KEY: mad_app_dev_password
      S3_BUCKET: mad-app-files

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # MinIO بـ`docker run` لا كحاوية خدمة: خدمات GitHub لا تقبل `command:`،
      # وصورة minio تحتاج `server /data` وسيطاً — بدونه تخرج فوراً. والنمط
      # قائمٌ في هذا الملف أصلاً (`nginx-cache`).
      #
      # ولا خطوة `mc mb`: `FilesService.onModuleInit` ينشئ الحاوية عند أول
      # إقلاع (مقروءٌ من المصدر لا مفترَض).
      - name: تشغيل MinIO وانتظار جاهزيته
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=mad_app -e MINIO_ROOT_PASSWORD=mad_app_dev_password \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9100/minio/health/live; then echo "MinIO جاهز بعد ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::MinIO لم يجهز خلال 30 ثانية"; docker logs minio; exit 1

      - name: إنشاء دور app_user (نظير docker/postgres-init-prod)
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'ci_app_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT ALL PRIVILEGES ON DATABASE mad_app TO app_user;
          ALTER SCHEMA public OWNER TO app_user;
          SQL

      - name: prisma generate + migrate deploy
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # البذرة لازمة لا تكميلية: `Company` يتطلّب `loginIdentityId`
      # و`permissionTemplateId`، فتركيب منشأة داخل الاختبار يعني إعادة بناء
      # مسار التسجيل — ويصير الاختبار يحرس نسخته من المسار لا المسار نفسه.
      - name: بذرة (منشآت حقيقية عبر مسار الإنشاء)
        working-directory: apps/api
        run: npx prisma db seed

      # حارسٌ للحارس — للسجلّين معاً: الترحيل يجب أن يكون قد طُبِّق فعلاً،
      # وإلا مرّت الاختبارات على جدولٍ لا وجود له بأخطاءٍ تبدو كرفض.
      #
      # ⚠️ ولا يكفي أن يردّ الاستعلام: جدولٌ بلا مُشغِّلات يُعطي مجموعةً
      # فارغة **بنجاح**، فتمرّ الاختبارات على جدولٍ بلا حماية بأخطاءٍ تبدو
      # كرفض. فيُتحقَّق من **العدد** لا من نجاح الأمر.
      - name: التحقق أن الجدولين ومُشغِّلاتهما موجودة فعلاً
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          SELECT tgrelid::regclass AS "table", tgname
            FROM pg_trigger
           WHERE tgrelid IN ('delegation_logs'::regclass, 'task_logs'::regclass)
             AND NOT tgisinternal
           ORDER BY 1, 2;

          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM pg_trigger
             WHERE tgrelid IN ('delegation_logs'::regclass, 'task_logs'::regclass)
               AND NOT tgisinternal;
            IF n <> 4 THEN
              RAISE EXCEPTION 'متوقَّع 4 مُشغِّلات (إدراج + ملحق-فقط لكل سجل) ووُجد %', n;
            END IF;
          END $$;
          SQL

      - name: الإثبات الحيّ — تسعة مسارات على السجلّين (blocking)
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npx jest src/delegations/delegation-log.live.spec.ts src/tasks/task-log.live.spec.ts src/activities/rls-probe.live.spec.ts --verbose 2>&1 | tee /tmp/live.log

      - name: ملخّص خام (السجلّان)
        if: always()
        run: grep -aE "✓|✗|√|×|Tests:|Suites:" /tmp/live.log || echo "(لا ملخّص)"

      # ═══ الـ77 اختبار تكامل — أول تشغيل لها في السير على الإطلاق ═══
      #
      # `npm run test:e2e` لا استدعاء jest مباشرةً: السكربت يحمل
      # `--runInBand --forceExit` وهما قرارا المشروع لا تفصيلتان. وإعادة
      # كتابتهما هنا تعني نسخةً ثانية من القرار تفترق عن الأولى بصمت.
      #
      # ⚠️ `set -o pipefail` مع `tee`: صدفة Actions الافتراضية `bash -e` بلا
      # pipefail، فرمز خروج الأنبوب رمزُ `tee` — صفرٌ دائماً. بدونه تعود
      # الوظيفة خضراء ولو سقطت السبعة والسبعون كلها.
      #
      # و`if: always()` لا لتخفيف المنع — الخطوة تُسقط الوظيفة كما هي. بل
      # لئلا يحجب سقوطُ الخطوة السابقة نتيجةَ هذه: خطوةٌ تتوقّف عند أول فشل
      # تترك 77 مجموعة **بلا نتيجة**، فيُقرأ الأحمر على أنه السجلّان وحدهما
      # ويُصلَح ما ليس معطوباً. سقوطان يُريان أصدق من واحدٍ يحجب الآخر.
      - name: اختبارات التكامل — 77 مجموعة على قاعدة حيّة (blocking)
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log

      # حارسٌ للحارس: عددُ ما نُفِّذ يطابق ما على القرص.
      #
      # ⚠️ يقرأ **القرص** لا مخرَج jest وحده. الوظيفة كلها وُلدت من عطلٍ من
      # هذه العائلة: استدعاءٌ يسمّي ملفّين بعينهما، فتبقى 92 مجموعة خارج
      # السير سنةً بلا أن يشتكي شيء. وعددٌ ناقص هنا يعني حارساً سقط خارج
      # نطاق jest — والوظيفة تبقى خضراء بدونه.
      - name: التحقق أن الـ77 نُفِّذت فعلاً
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          on_disk=$(find test -name '*.e2e-spec.ts' | wc -l)
          ran=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log \
            | grep -aoE "Test Suites:.*[0-9]+ total" | grep -aoE "[0-9]+ total" | grep -aoE "^[0-9]+" || echo 0)
          echo "على القرص: $on_disk · نُفِّذ: $ran"
          if [ "$on_disk" != "$ran" ]; then
            echo "::error::تفاوت: $on_disk اختبار تكامل على القرص و$ran منفَّذ — حارسٌ سقط خارج نطاق jest"
            exit 1
          fi

      # ملخّص دائم في **كل** تشغيل. درسُ Playwright: رقمٌ مقروء في السجل
      # أرخص من أثرٍ يُنزَّل، وأصدق من استنتاجٍ من خلوّ `--log-failed`.
      - name: ملخّص خام (التكامل) + أسماء الساقط
        if: always()
        shell: bash
        run: |
          echo "──────── الملخّص ────────"
          grep -aE "Tests:|Test Suites:|Time:" /tmp/e2e.log || echo "(لا ملخّص)"
          echo ""
          echo "──────── المجموعات الساقطة ────────"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -aE "^(FAIL|  ●)" | head -80 || echo "(لا سقوط)"

      - name: سجل MinIO
        if: failure()
        run: docker logs minio 2>&1 | tail -30 || true

  # الاختبار ٧ — ترويسات التخزين، على nginx **الحقيقي** لا على خادم المعاينة.
  #
  # لماذا وظيفة مستقلة: الترويسات تخصّ صورة الإنتاج (`apps/web/Dockerfile` +
  # `docker/web-nginx.conf`)، وخادم معاينة vite لا يقدّمها أصلاً — فكان
  # `caching.spec.ts` مشروطاً بـ`E2E_BASE_URL` ومربوطاً بإجراءٍ يدوي قبل
  # النشر، أي أنه **لم يُنفَّذ في أي بيئة قط**. وحارسٌ لا يعمل ليس حارساً،
  # وهذا تحديداً الحارس الوحيد لإصلاح الصفحة البيضاء.
  #
  # ⛔ مانعة من أول يوم — بلا `continue-on-error`. درسُ 2026-08-12: وضع
  # الإبلاغ لم يُنقذ حارساً قط، بل أخفى ستة سقوطات وأنتج دمجاً على أخضرَ كاذب.
  nginx-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # سياق البناء هو جذر المستودع (الـDockerfile ينسخ package-lock والحزم).
      - name: بناء صورة الواجهة (nginx + الحزمة المبنية)
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:3000 -t mad-web:ci .

      - name: تشغيل الصورة وانتظار جاهزيتها
        run: |
          docker run -d --name mad-web -p 8080:80 mad-web:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then echo "nginx جاهز بعد ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::الصورة لم تجهز خلال 30 ثانية"; docker logs mad-web; exit 1

      # 📉 **حدٌّ مقصود ومُعلَن:** عرضٌ واحد لا ثلاثة. ترويسات التخزين تخرج من
      # nginx مستقلةً عن مقاس النافذة تماماً، فثلاثة أعراض = ٣× كلفة بصفر
      # معلومة إضافية. ولا متصفح يُنزَّل: الثلاثة تستعمل `request` وحده لا
      # `page` — مُتحقَّق منه محلياً بتوجيه `PLAYWRIGHT_BROWSERS_PATH` إلى
      # مجلد فارغ، فمرّت الثلاثة. أي أن `playwright install` هدرٌ هنا.
      #
      # ولا API في هذه الوظيفة عمداً: `globalSetup` يكتشف ذلك ويكتب
      # `{hasApi:false}` بلا تسجيل منشأة — فلا أثر ولا حاجة لتنظيف.
      - name: الاختبار ٧ على nginx (blocking)
        shell: bash
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          set -o pipefail
          npm run test:e2e --workspace apps/web -- e2e/caching.spec.ts --project=desktop-1280 2>&1 | tee /tmp/cache.log

      # نفس درس حارس التخطّي الميت: تخطٍّ صامت هنا يترك المنعَ بلا معنى —
      # فالوظيفة كلها ثلاثة اختبارات، وتخطّيها يعني أن `E2E_BASE_URL` لم يصل.
      - name: التحقق أن الاختبار ٧ نُفِّذ فعلاً ولم يُتخطَّ
        if: always()
        shell: bash
        run: |
          if sed 's/\x1b\[[0-9;]*m//g' /tmp/cache.log 2>/dev/null | grep -aqE "^[[:space:]]*[0-9]+ skipped"; then
            echo "::error::الاختبار ٧ مُتخطّى رغم وجود nginx — E2E_BASE_URL لم يصل إلى playwright"
            docker logs mad-web || true
            exit 1
          fi
          grep -aE "^[[:space:]]*[0-9]+ (passed|failed|skipped)" /tmp/cache.log || echo "(لا ملخّص)"

      - name: سجل nginx
        if: failure()
        run: docker logs mad-web || true

  playwright:
    runs-on: ubuntu-latest

    # قاعدة بيانات حقيقية: اختبارات التخطيط تسجّل منشأة فعلية عبر الـAPI
    # (قرار المالك: العزل أهم من السرعة). وبدونها كانت تُتخطّى — أي أن السير
    # يمنع على ستة اختبارات ويترك الحارس الوحيد للتخطيط بلا تنفيذ.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mad_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: mad_app
        ports: ['5432:5432']
        # `-U mad_app` لا `pg_isready` مجرّداً: بلا مستخدمٍ صريح يتصل الفحص
        # بالمستخدم الافتراضي (root) فيطبع
        #   FATAL: role "root" does not exist
        # كل خمس ثوانٍ. لا يمنع شيئاً — الفحص يعتدّ بردّ الخادم لا بنجاح
        # الاتصال — لكنه يدفن سطور الفشل الحقيقية تحت ضجيج، وهو ما جعل
        # استخراج سبب سقوطٍ في السير متعذّراً.
        options: >-
          --health-cmd "pg_isready -U mad_app -d mad_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # كلمات مرور CI صريحةً في الملف عمداً: القاعدة تُخلق وتموت مع الوظيفة
      # ولا تُنشر على شبكة، فلا سرّ هنا يُحمى — ووضعها في secrets يوحي بأمانٍ
      # وهمي ويجعل السير غير قابل للتشغيل على نسخة مستنسخة.
      PGPASSWORD: ci_only_not_a_secret
      APP_DB_PASSWORD: ci_app_pass
      DATABASE_URL: postgresql://app_user:ci_app_pass@localhost:5432/mad_app?schema=public
      JWT_ACCESS_SECRET: ci-jwt-secret-not-used-outside-ci-0123456789
      DEV_SEED_PLATFORM_ADMIN_USERNAME: Arsan_admin
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: CiAdminPass123!
      E2E_API_URL: http://localhost:3000
      # ⚠️ 4173 لا 5173 — ومنفذٌ خاطئ هنا يُسقط كل اختبار يمرّ بالدخول.
      #
      # الحادثة: كان غائباً، فعاد الـAPI إلى افتراضي `main.ts:35`
      # (`http://localhost:5173`) بينما Playwright يقدّم البناء على **4173**
      # (`playwright.config.ts:15`). فرفض CORS طلبَ الدخول، ولم يُركَّب
      # `.app-shell` قط، وسقطت الاختبارات بـ`TimeoutError` على **العروض
      # الثلاثة معاً** — وهو ما برّأ أ٣: عطلُ تخطيطٍ يمسّ 375 وحده.
      #
      # ولم يكن تباطؤاً: كل محاولة استغرقت المهلة بالضبط (20.5s ثم 45.0s بعد
      # رفعها)، ورفعُ المهلة لم يغيّر شيئاً — لم يصل الطلب أصلاً.
      WEB_ORIGIN: http://localhost:4173
      # NODE_ENV يبقى development عمداً: حارس أسرار الإنتاج
      # (production-secrets.ts) يرفض الإقلاع بقيم كهذه — وهو تصرّفه الصحيح.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # دور app_user: في الإنتاج ينشئه سكربت تهيئة مربوط بالحاوية، ولا مقابل
      # له في `services:` — فيُنشأ هنا يدوياً بنفس الخصائص. NOSUPERUSER
      # وNOBYPASSRLS شرطان لا تفصيل: الدور الخارق يتجاوز عزل الصفوف بصمت،
      # فاختبارٌ يعمل بدورٍ خارق لا يختبر العزل أصلاً.
      - name: إنشاء دور app_user (نظير docker/postgres-init-prod)
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'ci_app_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT ALL PRIVILEGES ON DATABASE mad_app TO app_user;
          ALTER SCHEMA public OWNER TO app_user;
          SQL

      - name: prisma generate + migrate deploy
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # بذرة التطوير: تُنشئ مدير المنصة والقوالب العامة — ومدير المنصة لازم
      # لتنظيف منشآت الاختبار (DELETE /companies/:id). القاعدة تموت مع الوظيفة
      # فبياناتها التجريبية بلا أثر.
      - name: بذرة (مدير المنصة + القوالب)
        working-directory: apps/api
        run: npx prisma db seed

      - name: إقلاع الـAPI وانتظار جاهزيته
        working-directory: apps/api
        run: |
          npm run start > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/docs; then echo "API جاهز بعد ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "::error::الـAPI لم يجهز خلال 600 ثانية"; tail -40 /tmp/api.log; exit 1

      # `npm exec --workspace` لا `npx --workspace`: الأخيرة ليست علماً في npx،
      # فتُفسَّر كوسيط لـplaywright ويُجلب ثنائيٌّ من ذاكرة npx بدل المثبَّت
      # محلياً — فينهار التشغيل بـERR_MODULE_NOT_FOUND عند حلّ @playwright/test.
      # (انكشف بمحاكاة السير محلياً قبل دفعه.)
      - run: npm exec --workspace apps/web -- playwright install --with-deps chromium

      # ⛔ تمنع الدمج **من اليوم** (قرار المالك 2026-08-12، مقدَّماً على
      # 2026-08-17 المخطَّط له). السبب واقعة لا مبدأ: بقيت `continue-on-error`
      # فسقطت ستة اختبارات في تشغيلين متتاليين، وظهرت الوظيفة **خضراء** في
      # الواجهة وفي `gh run view --log-failed` معاً — فدُمج فرعٌ على أساس
      # «أخضر» لا يعني إلا «لم يُمنع الدمج». حارسٌ لا يُرى سقوطه ليس حارساً.
      #
      # `tee` لا إعادة توجيه: المخرَج يبقى في السجل المباشر **و**يُحفظ لخطوة
      # الملخّص بعده.
      #
      # ⚠️ و`set -o pipefail` شرطُ صحّةٍ لا تجميل: صدفة Actions الافتراضية
      # `bash -e` **بلا pipefail**، فرمز خروج الأنبوب يكون رمز `tee` — وهو صفرٌ
      # دائماً. بدونه تبتلع هذه الخطوة سقوطَ playwright وتعود الوظيفة خضراء:
      # أي إعادةُ إنتاجٍ حرفية للعطل الذي حُذفت `continue-on-error` من أجله،
      # وبلبوسٍ أخفى.
      - name: playwright — 375/768/1280 (blocking)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e --workspace apps/web 2>&1 | tee /tmp/pw.log

      # حارسٌ للحارس: إن تُخطّي اختبارٌ رغم وجود قاعدة وAPI، فالسبب عطل في
      # الإقلاع لا غياب بنية — ويجب أن **يمنع**، لا أن يُقرأ نجاحاً.
      #
      # ⚠️ صياغةٌ أولى بحثت عن `"status":"skipped"` في `.last-run.json`، وهو
      # بحثٌ **لا يُطابق أبداً** (الملف لا يذكر المتخطّى قط) — فكان الحارس
      # ميتاً. فنُقل إلى مخرَج playwright نفسه.
      #
      # ⚠️ وصياغةٌ ثانية طابقت **أرقام أسطر ثابتة** في `layout.spec.ts`
      # (`:(43|50|56|72)`) — وهي حارسٌ **يُبطله أي تحرير في الملف الذي
      # يحرسه**: سطرٌ يُضاف في أعلاه — ولو تعليقاً — يُزيح الأربعة فيصمت
      # الحارس **ويبقى أخضر**. مُثبَتٌ بالعكس: بإضافة سطرٍ واحد لم يعد أيٌّ
      # من الأربعة اختباراً.
      #
      # فالحارس الآن سكربتٌ يقرأ **أسماء** الاختبارات من مصدرها ويشتقّ منه
      # أيَّها يُتوقّع على أيّ عرض — انظر `apps/web/e2e/assert-not-skipped.mjs`.
      # وهو أوسع من سابقه: يغطّي كل ملفات `e2e/` لا `layout` وحده.
      - name: التحقق أن الاختبارات نُفِّذت فعلاً ولم تُتخطَّ
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node apps/web/e2e/assert-not-skipped.mjs /tmp/pw.log apps/web/e2e || {
            tail -40 /tmp/api.log || true
            exit 1
          }
          tail -20 /tmp/api.log || true

      # ملخّص دائم في **كل** تشغيل — ناجحاً كان أم ساقطاً.
      #
      # هذه الخطوة (بأختها تحتها) هي التي كشفت أن «الأخضر» كان كاذباً؛ ولولاها
      # لبقينا نطارد شبحاً. فتبقى دائمة لا مؤقتة: رقمٌ مقروء في السجل أرخص من
      # أثرٍ يُنزَّل ويُفتح محلياً، وأصدق من استنتاجٍ من خلوّ `--log-failed`.
      - name: ملخّص Playwright (passed / failed / skipped)
        if: always()
        run: |
          echo "──────── ملخّص Playwright ────────"
          grep -aE "^[[:space:]]*[0-9]+ (passed|failed|skipped|flaky|interrupted|did not run)" /tmp/pw.log \
            || echo "(لا ملخّص — لم يصل التشغيل إلى نهايته أصلاً)"

      # سبب السقوط **في السجل نفسه** لا في أثرٍ يحتاج تنزيلاً.
      #
      # وُلدت هذه الخطوة من عجزٍ حقيقي: سقطت playwright في السير ولم يمكن
      # استخراج السطر، لأن واجهة GitHub تعرض سجل حاوية postgres لا خطوة
      # الاختبارات. فمن يقرأ النتيجة يرى «exit 1» بلا سبب — وتشخيصٌ يحتاج
      # تنزيل أثرٍ ثم فتحه محلياً ليس تشخيصاً متاحاً.
      - name: طباعة تفاصيل السقوط (اسم الاختبار ورسالته)
        if: always()
        run: |
          echo "──────── ملخّص التشغيل ────────"
          cat apps/web/test-results/.last-run.json 2>/dev/null || echo "(لا ملخّص)"
          echo ""
          echo "──────── سياق كل سقوط ────────"
          found=0
          for f in apps/web/test-results/*/error-context.md; do
            [ -e "$f" ] || continue
            found=1
            echo "═══ $f ═══"
            head -60 "$f"
            echo ""
          done
          [ "$found" = "0" ] && echo "(لا ملفات سياق — لم يسقط شيء أو لم يُكتب الأثر)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
