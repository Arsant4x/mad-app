# اختبارات الواجهة — vitest (مكوّنات) + Playwright (متصفح، ثلاثة عروض).
#
# ⛔ vitest تمنع الدمج **من اليوم** — حتمية بلا اعتماد خارجي، فلا عذر لسقوطها.
# ⏳ Playwright تُبلّغ حتى 2026-08-17 ثم تمنع: قد تهتزّ لأسبابٍ بيئية، وحارسٌ
#    صارم على اختباراتٍ لم تستقرّ يُعطَّل عند أول سقوط كاذب فيموت.
#    **في 2026-08-17 احذف `continue-on-error` من خطوة playwright.**
#    التاريخ مثبَّت هنا وفي CLAUDE.md معاً كي لا يُنسى في وضع الإبلاغ للأبد.
#
# 🔒 إصدار Node مثبَّت في موضعين — هنا وفي `engines` بكل package.json.
#    السبب حادثة حقيقية: السير كان على 20 والتطوير على 24، فمرّت الاختبارات
#    محلياً وسقطت الخمسة في CI عند التحميل بـ
#    `TypeError: webidl.util.markAsUncloneable is not a function` — jsdom 30
#    يستدعي عبر undici دالةً موجودة في Node 22+ وغائبة في 20. تفاوت البيئتين
#    هو العطل نفسه، فلا يُثبَّت في أحدهما دون الآخر.
name: web-tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - '.github/workflows/web-tests.yml'

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # --ignore-scripts: ثنائي esbuild يصل عبر optionalDependencies (حزمة
      # المنصة @esbuild/linux-x64)، لا عبر postinstall — فالسكربت احتياطٌ لا
      # حاجة إليه، وتخطّيه يجعل التثبيت حتمياً ويُسكت تحذير allow-scripts.
      # مُتحقَّق منه: npm ci بلا موافقة سكربتات يترك esbuild عاملاً (--version).
      - run: npm ci --ignore-scripts
      # ⛔ vitest **تمنع من اليوم** (قرار المالك 2026-08-11): لا اعتماد خارجي
      # لها — لا قاعدة ولا شبكة ولا متصفح — فلا عذر لسقوطها، ولا معنى لتأجيل
      # صرامةٍ على اختباراتٍ حتمية. التأجيل إلى 2026-08-17 يخصّ Playwright
      # وحدها، فهي التي قد تهتزّ لأسبابٍ بيئية.
      - name: vitest (blocking)
        run: npm run test --workspace apps/web

  playwright:
    runs-on: ubuntu-latest

    # قاعدة بيانات حقيقية: اختبارات التخطيط تسجّل منشأة فعلية عبر الـAPI
    # (قرار المالك: العزل أهم من السرعة). وبدونها كانت تُتخطّى — أي أن السير
    # يمنع على ستة اختبارات ويترك الحارس الوحيد للتخطيط بلا تنفيذ.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mad_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: mad_app
        ports: ['5432:5432']
        # `-U mad_app` لا `pg_isready` مجرّداً: بلا مستخدمٍ صريح يتصل الفحص
        # بالمستخدم الافتراضي (root) فيطبع
        #   FATAL: role "root" does not exist
        # كل خمس ثوانٍ. لا يمنع شيئاً — الفحص يعتدّ بردّ الخادم لا بنجاح
        # الاتصال — لكنه يدفن سطور الفشل الحقيقية تحت ضجيج، وهو ما جعل
        # استخراج سبب سقوطٍ في السير متعذّراً.
        options: >-
          --health-cmd "pg_isready -U mad_app -d mad_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # كلمات مرور CI صريحةً في الملف عمداً: القاعدة تُخلق وتموت مع الوظيفة
      # ولا تُنشر على شبكة، فلا سرّ هنا يُحمى — ووضعها في secrets يوحي بأمانٍ
      # وهمي ويجعل السير غير قابل للتشغيل على نسخة مستنسخة.
      PGPASSWORD: ci_only_not_a_secret
      APP_DB_PASSWORD: ci_app_pass
      DATABASE_URL: postgresql://app_user:ci_app_pass@localhost:5432/mad_app?schema=public
      JWT_ACCESS_SECRET: ci-jwt-secret-not-used-outside-ci-0123456789
      DEV_SEED_PLATFORM_ADMIN_USERNAME: Arsan_admin
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: CiAdminPass123!
      E2E_API_URL: http://localhost:3000
      # NODE_ENV يبقى development عمداً: حارس أسرار الإنتاج
      # (production-secrets.ts) يرفض الإقلاع بقيم كهذه — وهو تصرّفه الصحيح.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # دور app_user: في الإنتاج ينشئه سكربت تهيئة مربوط بالحاوية، ولا مقابل
      # له في `services:` — فيُنشأ هنا يدوياً بنفس الخصائص. NOSUPERUSER
      # وNOBYPASSRLS شرطان لا تفصيل: الدور الخارق يتجاوز عزل الصفوف بصمت،
      # فاختبارٌ يعمل بدورٍ خارق لا يختبر العزل أصلاً.
      - name: إنشاء دور app_user (نظير docker/postgres-init-prod)
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'ci_app_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT ALL PRIVILEGES ON DATABASE mad_app TO app_user;
          ALTER SCHEMA public OWNER TO app_user;
          SQL

      - name: prisma generate + migrate deploy
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # بذرة التطوير: تُنشئ مدير المنصة والقوالب العامة — ومدير المنصة لازم
      # لتنظيف منشآت الاختبار (DELETE /companies/:id). القاعدة تموت مع الوظيفة
      # فبياناتها التجريبية بلا أثر.
      - name: بذرة (مدير المنصة + القوالب)
        working-directory: apps/api
        run: npx prisma db seed

      - name: إقلاع الـAPI وانتظار جاهزيته
        working-directory: apps/api
        run: |
          npm run start > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/docs; then echo "API جاهز بعد ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "::error::الـAPI لم يجهز خلال 600 ثانية"; tail -40 /tmp/api.log; exit 1

      # `npm exec --workspace` لا `npx --workspace`: الأخيرة ليست علماً في npx،
      # فتُفسَّر كوسيط لـplaywright ويُجلب ثنائيٌّ من ذاكرة npx بدل المثبَّت
      # محلياً — فينهار التشغيل بـERR_MODULE_NOT_FOUND عند حلّ @playwright/test.
      # (انكشف بمحاكاة السير محلياً قبل دفعه.)
      - run: npm exec --workspace apps/web -- playwright install --with-deps chromium

      - name: playwright — 375/768/1280 (report-only until 2026-08-17)
        continue-on-error: true # ⏳ احذفه في 2026-08-17
        run: npm run test:e2e --workspace apps/web

      # حارسٌ للحارس: إن تُخطّي أيّ اختبار تخطيطٍ رغم وجود قاعدة، فالسبب عطل
      # في الإقلاع لا غياب بنية — ويجب أن يُرى لا أن يُقرأ نجاحاً.
      - name: التحقق أن اختبارات التخطيط نُفِّذت فعلاً ولم تُتخطَّ
        if: always()
        run: |
          if grep -q '"status":"skipped"' apps/web/test-results/.last-run.json 2>/dev/null; then
            echo "::warning::اختبارات تخطيط مُتخطّاة رغم وجود postgres — افحص سجل الـAPI"
          fi
          tail -20 /tmp/api.log || true

      # سبب السقوط **في السجل نفسه** لا في أثرٍ يحتاج تنزيلاً.
      #
      # وُلدت هذه الخطوة من عجزٍ حقيقي: سقطت playwright في السير ولم يمكن
      # استخراج السطر، لأن واجهة GitHub تعرض سجل حاوية postgres لا خطوة
      # الاختبارات. فمن يقرأ النتيجة يرى «exit 1» بلا سبب — وتشخيصٌ يحتاج
      # تنزيل أثرٍ ثم فتحه محلياً ليس تشخيصاً متاحاً.
      - name: طباعة تفاصيل السقوط (اسم الاختبار ورسالته)
        if: always()
        run: |
          echo "──────── ملخّص التشغيل ────────"
          cat apps/web/test-results/.last-run.json 2>/dev/null || echo "(لا ملخّص)"
          echo ""
          echo "──────── سياق كل سقوط ────────"
          found=0
          for f in apps/web/test-results/*/error-context.md; do
            [ -e "$f" ] || continue
            found=1
            echo "═══ $f ═══"
            head -60 "$f"
            echo ""
          done
          [ "$found" = "0" ] && echo "(لا ملفات سياق — لم يسقط شيء أو لم يُكتب الأثر)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
