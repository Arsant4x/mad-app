# الثقيل — قاعدةٌ حيّة (`db-integration`) · صورةُ nginx (`nginx-cache`) · متصفّح
# (`playwright`). يعمل **عند فتح الطلب لما يمسّ شيفرة، وعند الدمج مطلقاً**.
#
# ═══ لماذا ملفّان (ق-٢٥١ · حكم المالك 2026-09-07) ═══
#
# «الثقيلُ عند الفتح وعند الدمج **لما يمسّ شيفرة**، والوثائقيُّ عند الدمج وحده —
#  **ويُقاس بالمسار لا بالنيّة**.»
#
# و`paths` **لا تعيش على الوظيفة** بل على المُشغِّل، **ووظيفةٌ تسأل عن الملفات
# المتغيّرة تكون قد بدأت فتُحاسَب** — فالتفريقُ بالمسار لا يكون إلا بمُشغِّلَين:
# `web-tests-light.yml` بمساراتٍ واسعة وعلى كل دفع، وهذا الملفّ بمسارات الشيفرة
# وحدها وبلا `synchronize`. **والشرطُ هو المُشغِّل نفسه — لا `if` على الوظائف**،
# فآليّتان تحكمان الشيءَ نفسه تفترقان يوماً (وقد كان هنا `if` فحُذف مع التصفية).
#
# ⚠️ **الثمنُ المعلَن**: خطأٌ في القاعدة أو المتصفّح يُكتشف **عند فتح الطلب** أو
#    **بعد الدمج** لا عند كل دفع — فدورةُ التغذية الراجعة تطول، وقد تصل `main`
#    بخطأٍ يُصلَح بعده. «مقبولٌ اليوم لا دائماً».
#
# ⚠️ **وثقبٌ معلَن**: طلبٌ يُفتح وثائقياً ثم تُدفع فيه شيفرة **لا يعمل عليه ثقيلٌ
#    قبل الدمج** — الفتحُ مضى، و`synchronize` مستثناة. ويُغلَق ببوّابة الدمج
#    (خطّاف `gh pr merge`) لا بالتذكير.
#
# ⛔ Playwright تمنع الدمج — قُدِّمت عن 2026-08-17 المخطَّط. كان التأجيل مبنياً
#    على أن حارساً صارماً يُعطَّل عند أول سقوط كاذب فيموت. والتجربة أعطت العكس:
#    وضع الإبلاغ لم يُنقذ حارساً، بل أخفى ستة سقوطات حقيقية وأنتج دمجاً على
#    أساس أخضرَ كاذب. الحارس المؤجَّل هو الذي يموت.
#
# 📌 ولا تُضف `continue-on-error` هنا مجدداً، ولا `| tee` بلا `pipefail`:
#    كلاهما يُخضِّر وظيفةً ساقطة — والثاني أخفى لأنه لا يترك أثراً في الملف.
#
# 🔒 إصدار Node مثبَّت في **ثلاثة** مواضع — هنا، وفي `engines` بكل
#    package.json، **وفي صور الإنتاج** (`apps/*/Dockerfile`) — وحارسُه في
#    `web-tests-light.yml` لأنه يعمل على كل دفع. وبقيت `apps/api/Dockerfile`
#    على `node:20` حتى 2026-08-16، أي أن الحارس الذي وُضع لمنع تفاوت البيئتين
#    **أُغفل عند أخطرها**: السير كان على 20 والتطوير على 24، فمرّت الاختبارات
#    محلياً وسقطت الخمسة في CI بـ
#    `TypeError: webidl.util.markAsUncloneable is not a function` — jsdom 30
#    يستدعي عبر undici دالةً موجودة في Node 22+ وغائبة في 20.
name: web-tests

on:
  # ⚠️ (ق-٢٧٢ · 2026-09-07) **«ما يصل `main` يُفحص بما يخصّه»** — تصحيحُ ق-٢٥١.
  #
  # كانت: `push` **بلا تصفية** («فما يصل `main` يُفحص كاملاً مهما كان مسارُه»).
  # وكانت صحيحةً **حين كان كلُّ ما يصل `main` شيفرة**. واليومَ تصله سجلّاتٌ ووثائقُ
  # كثيرة، **وحرّاسُ الوثائق كلُّها في الخفيف** (`no-id-scan` · `registry-numbering` ·
  # `spec-tags` · `moved-paths` · `rule-extension-attached`).
  #
  # المقيس (2026-09-07): **أربعةٌ من خمسَ عشرة دمجةً في يومٍ وثائقيةٌ محضة** ودفعت
  # ثقيلاً كاملاً على `main` — **≈٣٦ دقيقة ≈ $0.29 يومياً بلا شيءٍ يُفحص**.
  #
  # والمساراتُ هنا **هي نفسُها مسارات `pull_request` أدناه** — لا قائمةٌ ثانية:
  # يحرس تطابقَهما `ci-split.spec.ts`، فقائمتان تفترقان يوماً.
  #
  # ⚠️ **والثقبُ محروسٌ لا متروك**: طلبٌ يُفتح وثائقياً ثم تُدفع فيه شيفرة يُرفض
  # دمجُه حتى يعمل عليه ثقيل (`ق-٢٥٤`، خطّاف `gh pr merge`) — فالتصفيةُ هنا لا
  # تفتح باباً، لأن ما يمسّ شيفرةً لا يصل `main` بلا فحصٍ ثقيلٍ في تاريخه.
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    # ⚠️ (ق-٢٥١) **لا `synchronize` هنا** — فالثقيلُ عند **فتح** الطلب وحده، ودفعةٌ
    #    لاحقةٌ عليه لا تُشغّله. وهذا هو التقسيم نفسه: لا `if` على الوظائف بل
    #    مُشغِّلٌ لا يصلها أصلاً. و`ready_for_review` معلَنةٌ لأنها ليست افتراضية
    #    (ق-٢٥٠: شرطٌ يسمّي فعلاً غيرَ معلَن هو بوّابةٌ على بابٍ لا يُطرَق).
    types: [opened, reopened, ready_for_review]
    # ⚠️ (ق-٢٥١) **مساراتُ الشيفرة وحدها** — «ويُقاس بالمسار لا بالنيّة». فطلبٌ
    #    وثائقيٌّ محض لا يُشغّل الثقيلَ عند فتحه؛ ويُشغّله **عند الدمج** لأن
    #    `push` أعلاه بلا تصفيةِ مسارات: **ما يصل `main` يُفحص كاملاً مهما كان
    #    مسارُه**. أمّا حرّاسُ الوثائق فتشغّلها الحزمةُ الخفيفة على كل دفع.
    paths:
      - 'apps/**'
      - 'packages/**'
      # ⚠️ لازمٌ لا تكميلي: الاختبار ٧ يحرس ترويسات إعداد nginx بعينها. وبدونه
      # هنا، تعديلُ الإعداد **لا يُشغّل حارسه** — وهو بالضبط التغيير الذي أنتج
      # الصفحة البيضاء أول مرة. (و`apps/api/prisma/migrations/**` داخلةٌ في
      # `apps/**` — والإثباتُ الحيّ يحرسها.)
      - 'docker/**'
      # تعديلُ أيّ من ملفَّي السير يُشغّل الثقيلَ — فحارسُ التقسيم نفسُه شيفرة.
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'

# ⛔ بوّابةٌ لا تذكير — قرار المالك (2026-09-03)، §8.7 الوجه السادس.
#
# `grep` بلا لغةٍ مضبوطة يعامل النمط **بايتاتٍ لا أحرفاً**. وحرفٌ عربيّ بايتان،
# فصنفٌ حرفيّ مثل `[أبجد]` أو نقطةٌ `.` على نصٍّ عربيّ **يعود صفراً بلا خطأ** —
# ويُقرأ «غير موجود». وقد أسقطت هذه العلّة حكماً كاملاً: «المرحلة ب غير
# معرَّفة» — وهي معرَّفة، والبحث هو الذي عمي.
#
# ومستودعنا كل وثائقه عربية، فالعلّة تصيب **كل بحثٍ** لا بحثاً بعينه. ولذلك
# تُضبط اللغة هنا مرةً لكل الوظائف، ويحرسها `locale-gate.spec.ts`: أي `grep`
# في سكربتٍ أو خطّافٍ بنمطٍ يجمع حرفاً عربياً وصنفاً حرفياً بلا لغةٍ مضبوطة
# يُسقط الحزمة.
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

# ⚠️ (ق-٢٤٥ · 2026-09-06) دفعتان متتابعتان على طلبٍ واحد: تُلغى السابقةُ — فدقائقُ
# تشغيلٍ تجاوزه دفعٌ أحدث تُنفَق بلا حكمٍ يُقرأ. ولا يُلغى تشغيلُ `main` (الدمج)،
# فكلُّ دمجٍ يستحقّ فحصَه الثقيلَ كاملاً.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# «والحراسة لا تضعف بل تنتقل إلى موضعها — فما يُدمج هو ما يصل `main`.»
#
# والحارس `ci-split.spec.ts` مشتقٌّ لا قائمة: كلُّ وظيفةٍ تحمل قاعدةً (`services:`)
# أو تبني صورةً (`docker build`) أو تشغّل متصفّحاً **يجب أن تكون في هذا الملفّ**،
# وما سواها في الخفيف — ويوجب مُشغِّلَ كلٍّ منهما ومسارَه.
jobs:
  # كل ما يحتاج قاعدةً حيّة — الإثباتُ الحيّ للسجلّات **و**اختبارات التكامل.
  #
  # سُمّيت `append-only-logs-live` حتى 2026-08-13، ثم اتّسع ما تفعله فاتّسع
  # اسمها: وظيفةٌ باسمٍ أضيق ممّا تفعله تُقرأ خطأً — وهي عائلة الخطأ نفسها
  # التي وقعت حين حلّ تعليقُ `nginx-cache` فوق وظيفةٍ أخرى.
  #
  # ## ما تغطّيه
  #
  # ① الإثبات الحيّ لحرّاس `delegation_logs` و`task_logs`.
  #    `delegation-log.spec.ts` يقرأ نصّ الترحيل ويثبت أن المنع **مكتوب** —
  #    وهو لازمٌ لا كافٍ: نصٌّ سليم قد لا يُطبَّق (ترحيلٌ لم يُشغَّل · مُشغِّل
  #    أُسقط لاحقاً · دورٌ يتجاوز السياسة). **وحارس نظامي غير مُختبَر حيّاً
  #    ليس امتثالاً** (قرار المالك 2026-08-12).
  #
  # ② اختباراتُ التكامل في `test/` — **كانت خارج السير كلياً** حتى ذلك اليوم.
  #    وهي حرّاس المنصّة الفعلية: عزل المستأجر · العقود · الفوترة · ZATCA ·
  #    وضع الدعم · الأرشفة. أُضيفت بقرار المالك 2026-08-13: «حارس لا يُشغَّل
  #    ليس حارساً — وهي قاعدتنا التي بنينا عليها الاختبار السابع».
  #
  # ## لماذا تسلسلياً وبطيئاً
  #
  # `test:e2e` يحمل `--runInBand` منذ نشأته: مجموعاتُ التكامل **تتقاسم قاعدةً
  # واحدة**، وتوازيها يجعل توكيدات فروق الأرصدة تقرأ كتابةَ مجموعةٍ أخرى.
  # والقرار مُعلَن: **سيرٌ بطيء يمسك أفضل من سريع لا يرى**.
  #
  # ⭐ **وصار مُشرَّحاً — والتسلسلُ محفوظ** (`ق-٤٢٣` · `ق-٤٢٤`): الشرائحُ
  # **متتابعة لا متوازية**، وكلٌّ منها `--runInBand` — **فالقاعدةُ لا يكتبها
  # اثنان معاً**، **والذاكرةُ تعود إلى الصفر بين الشرائح**.
  #
  # ⚠️ **وثمنُه معلَنٌ ويُتابَع** (`ق-٤٠٥`): **الترتيبُ يُحفَظ داخل الشريحة لا
  # عبرها** — فمجموعةٌ تعتمد على أخرى في شريحةٍ ثانية لا تُكتشف هنا.
  # **فـ`npm run test:e2e:one-shard` يُشغَّل دورياً**، وأوّلُه على المضيف الجديد.
  #
  # ⛔ مانعة من أول يوم.
  db-integration:
    runs-on: ubuntu-latest
    # سقفٌ لئلا يلتهم تعليقٌ ستّ ساعات. خطّ الأساس 22 دقيقة، والضِّعف هامش.
    timeout-minutes: 60
    # 🔒 (`ق-١٤٠٨`) صورةُ MinIO في سجلّ GitHub الخاصّ — والرمزُ يقرأ الحزمَ صراحةً (`packages: read`)،
    #    والمستودعُ ممنوحٌ الوصولَ إلى الحزمة من إعداداتها («Manage Actions access»). والمحتوى قراءةٌ وحدَها.
    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mad_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: mad_app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mad_app -d mad_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: ci_only_not_a_secret
      # ⚠️ `app_user` لا الدور الخارق: الخارق يتجاوز RLS بصمت، فاختبارٌ
      # يعمل به لا يختبر العزل — ولا يختبر أن السياسة مفروضة (FORCE).
      DATABASE_URL: postgresql://app_user:ci_app_pass@localhost:5432/mad_app?schema=public
      # ⚠️ البذرة ترفض العمل بدونهما (`seed.ts:23`) — وهو تصرّفها الصحيح:
      # حساب مدير منصة بكلمة مرور افتراضية أسوأ من بذرةٍ لا تعمل. نُسيا في
      # أول صياغة فسقطت الوظيفة عند البذرة لا عند الحرّاس، والمخرَج جاء
      # فارغاً — «أحمر» بلا سطر اختبار واحد.
      DEV_SEED_PLATFORM_ADMIN_USERNAME: Arsan_admin
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: CiAdminPass123!

      # ⚠️ ما تحته منقولٌ من `apps/api/.env.test.example` — وهو **مصدر واحد**
      # كُتب من حوادث لا من تخمين. أُضيعت أربع دورات تشغيل (~ساعة ونصف) على
      # تفاوت هذه المتغيّرات بين البيئات، وكل سقوطٍ منها بدا **عطلاً في
      # المنصة** حتى فُحص. فلا يُنقص منها شيء بلا قراءة الملف.
      JWT_ACCESS_SECRET: test-jwt-secret-not-used-outside-tests-0123456789
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      WEB_ORIGIN: http://localhost:5173
      # ⚠️ غيابه يجعل `/zatca/onboarding/start` يرتدّ بـ400 فتسقط ثلاث
      # مجموعات بسببٍ يبدو منطقياً وليس كذلك.
      SECRETS_ENCRYPTION_KEY: test-secrets-key-at-least-32-characters-long
      # ⚠️ تشفيرُ الحقول الحسّاسة (ق-١٣٤٥) — غيابُها يُسقط `employee-identity`؛ قيمُ اختبارٍ منسوخةٌ من `.env.test.example`.
      PII_ENCRYPTION_KEYS: test1:ERERERERERERERERERERERERERERERERERERERERERE=
      PII_ENCRYPTION_KEY_ID: test1
      PII_BLIND_INDEX_KEY: tb1:IiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiI=
      # ⚠️ بلا MinIO يرتدّ رفع الشعار بـ500 وتسقط `company-profile`.
      S3_ENDPOINT: http://localhost:9100
      S3_ACCESS_KEY: mad_app
      S3_SECRET_KEY: mad_app_dev_password
      S3_BUCKET: mad-app-files

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # MinIO بـ`docker run` لا كحاوية خدمة: خدمات GitHub لا تقبل `command:`،
      # وصورة minio تحتاج `server /data` وسيطاً — بدونه تخرج فوراً. والنمط
      # قائمٌ في هذا الملف أصلاً (`nginx-cache`).
      #
      # ولا خطوة `mc mb`: `FilesService.onModuleInit` ينشئ الحاوية عند أول
      # إقلاع (مقروءٌ من المصدر لا مفترَض).
      # 🔴 **والصورةُ من سجلّ GitHub الخاصّ بحساب المالك، مثبَّتةً بالبصمة** (`ق-١٤٠٨` · 2026-09-24):
      #    توزيعُ MinIO المجانيّ غاب **مرّتين** — Docker Hub ردّ السحبَ المجهول (`ق-٦٠٠` · 2026-09-11)
      #    فانتقلنا إلى `quay.io`، ثم صار `quay.io` يردّ **`unauthorized`** (`401`) و`dl.min.io` `410`
      #    **فسقطت هذه الخطوةُ وسقط معها كلُّ ما بعدها**: `prisma generate` لم يعمل، فانهارت **كلُّ**
      #    مجموعات التكامل بـ`'@prisma/client' has no exported member 'PrismaClient'` — **عطلٌ يبدو
      #    في الشيفرة وسببُه سجلُّ صور** (و`main` نفسُه أحمر من `12:59Z`).
      # 🔒 **ونُسخت الصورةُ المخزَّنة نفسُها** إلى `ghcr.io/arsant4x/minio` — **خاصّةً والاستعمالُ داخليّ**؛
      #    والبصمةُ بصمةُ منصّة `linux/amd64` كما سُحبت من المصدر، فالإصدارُ نفسُه بايتاً — **وهي نسخةُ
      #    الإنتاج العاملة**: ملفّا التركيب والسيرُ على بصمةٍ واحدة، فما يُختبَر هو ما يُشغَّل.
      # ⚠️ **والدخولُ برمز الوظيفة** (`packages: read` أعلاه) — لا سرَّ يُضاف؛ وإن رُفض السحبُ فالحزمةُ
      #    لم تُمنح لهذا المستودع («Manage Actions access» في إعدادات الحزمة).
      - name: تشغيل MinIO وانتظار جاهزيته
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=mad_app -e MINIO_ROOT_PASSWORD=mad_app_dev_password \
            ghcr.io/arsant4x/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2 server /data
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9100/minio/health/live; then echo "MinIO جاهز بعد ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::MinIO لم يجهز خلال 30 ثانية"; docker logs minio; exit 1

      - name: إنشاء دور app_user (نظير docker/postgres-init-prod)
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'ci_app_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT ALL PRIVILEGES ON DATABASE mad_app TO app_user;
          ALTER SCHEMA public OWNER TO app_user;
          SQL

      - name: prisma generate + migrate deploy
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # البذرة لازمة لا تكميلية: `Company` يتطلّب `loginIdentityId`
      # و`permissionTemplateId`، فتركيب منشأة داخل الاختبار يعني إعادة بناء
      # مسار التسجيل — ويصير الاختبار يحرس نسخته من المسار لا المسار نفسه.
      - name: بذرة (منشآت حقيقية عبر مسار الإنشاء)
        working-directory: apps/api
        run: npx prisma db seed

      # حارسٌ للحارس — للسجلّين معاً: الترحيل يجب أن يكون قد طُبِّق فعلاً،
      # وإلا مرّت الاختبارات على جدولٍ لا وجود له بأخطاءٍ تبدو كرفض.
      #
      # ⚠️ ولا يكفي أن يردّ الاستعلام: جدولٌ بلا مُشغِّلات يُعطي مجموعةً
      # فارغة **بنجاح**، فتمرّ الاختبارات على جدولٍ بلا حماية بأخطاءٍ تبدو
      # كرفض. فيُتحقَّق من **العدد** لا من نجاح الأمر.
      - name: التحقق أن الجدولين ومُشغِّلاتهما موجودة فعلاً
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          SELECT tgrelid::regclass AS "table", tgname
            FROM pg_trigger
           WHERE tgrelid IN ('delegation_logs'::regclass, 'task_logs'::regclass)
             AND NOT tgisinternal
           ORDER BY 1, 2;

          DO $$
          DECLARE n int;
          BEGIN
            SELECT count(*) INTO n FROM pg_trigger
             WHERE tgrelid IN ('delegation_logs'::regclass, 'task_logs'::regclass)
               AND NOT tgisinternal;
            IF n <> 4 THEN
              RAISE EXCEPTION 'متوقَّع 4 مُشغِّلات (إدراج + ملحق-فقط لكل سجل) ووُجد %', n;
            END IF;
          END $$;
          SQL

      # ═══ الإثبات الحيّ — **مشتقٌّ من القرص لا مكتوبٌ بالمسار** ═══
      #
      # كانت الملفات تُسمّى واحداً واحداً. ومجسّ حيّ جديد يُنسى من القائمة
      # **يمرّ صامتاً**: يوجد على القرص، أخضرُ محلياً، ولا يُشغَّل في السير
      # أبداً — وهي عائلة العطل نفسها التي وُلد منها حارسا العدّ في هذا الملف.
      #
      # فالنمط يُشتقّ الآن (`--testPathPattern 'live\.spec'`)، والحارس بعده
      # يطابق **ما على القرص** بمجموع ما نُفِّذ في الخطوتين.
      #
      # 📌 `period-lock-tz` مستثناة هنا **بسببٍ مكتوب لا بالسهو**: تحتاج
      #    `TZ` غربية فتُشغَّل في خطوتها الخاصة أدناه — والحارس يعدّها هناك.
      - name: الإثبات الحيّ — كل مجسّ حيّ إلا ما له بيئة خاصة (blocking)
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npx jest --roots '<rootDir>/src' --testPathPattern 'live\.spec' \
            --testPathIgnorePatterns 'period-lock-tz' --verbose 2>&1 | tee /tmp/live.log

      - name: ملخّص خام (المجسّات الحيّة)
        if: always()
        run: grep -aE "✓|✗|√|×|Tests:|Suites:" /tmp/live.log || echo "(لا ملخّص)"

      # ═══ قفل الفترة تحت منطقةٍ غرب غرينتش — خطوةٌ مستقلّة بمنطقةٍ مستقلّة ═══
      #
      # `assertPeriodOpen` **بوابة كل ترحيل** في النظام. وعطلُها الأصلي أنها
      # كانت تقرأ الشهر بدوالٍّ محلّية، فتاريخُ المستند `YYYY-MM-DD` (منتصف ليل
      # UTC) يُقرأ الشهرَ السابق غرب غرينتش — **فيمرّ القيد إلى فترةٍ مقفلة**.
      #
      # 📌 `TZ` هنا **شرط الإثبات لا زينة**: تحت UTC (منطقة العدّاء الافتراضية)
      #    لا ينزاح أي تاريخ، فيُخطّي الملف نفسه ولا يثبت شيئاً.
      #
      # ⚠️ **وهذه المنطقة نقيضُ حالتنا لا تمثيلٌ لها.** الرياض شرق غرينتش
      #    (`+03`)، وتاريخ المستند يصل منتصفَ ليل UTC — فيُقرأ فيها اليومَ
      #    نفسه والشهرَ نفسه. أي أن مستأجراً في الرياض **لم يكن معرَّضاً لهذا
      #    العطل**، والمعرَّض هو من كان **غرب** غرينتش. فتُضبط منطقةٌ غربية
      #    **لتوجد الحالة المعرَّضة أصلاً** — ولا يُقرأ خضرةُ هذه الخطوة
      #    تغطيةً لتشغيلنا في الرياض. والقيمة أن منطقة الخادم قرارُ نشرٍ
      #    يتغيّر، والمنصّة متعددة المستأجرين، فالبوابة يجب ألّا تعتمد عليها.
      #
      #    والخطوة منفصلة عمّا قبلها لأن ضبط المنطقة للسجلّين يغيّر بيئتهما
      #    بلا سبب.
      - name: قفل الفترة — أربعة مسارات تحت America/New_York (blocking)
        working-directory: apps/api
        shell: bash
        env:
          TZ: America/New_York
        run: |
          set -o pipefail
          npx jest src/fiscal/period-lock-tz.live.spec.ts --verbose 2>&1 | tee /tmp/period-tz.log

      # حارسٌ للحارس: التخطّي أخضرُ كالنجاح تماماً في مخرَج jest.
      #
      # فلو سقط ضبط `TZ` أعلاه (أو غُيِّر العدّاء) لتخطّى الملف نفسه بسطر
      # تحذير، **ومرّت الوظيفة خضراء وقد ذهب الحارس**. وهي عائلة العطل التي
      # وُلد منها حارسا العدّ في هذا الملف — فتُسدّ هنا بقراءة السطر بعينه.
      - name: التحقق أن قفل الفترة نُفِّذ ولم يُتخطَّ
        if: always()
        shell: bash
        run: |
          if grep -aq "period-lock-tz.live.spec: تُخطّى" /tmp/period-tz.log; then
            echo "::error::تُخطّي مجسّ قفل الفترة — TZ لم تصل إلى العملية، فالبوابة بلا حارس"
            grep -a "تُخطّى" /tmp/period-tz.log
            exit 1
          fi
          if grep -aqE "Tests:.*(skipped|todo)" /tmp/period-tz.log; then
            echo "::error::اختبارات مُتخطّاة داخل مجسّ قفل الفترة"
            exit 1
          fi
          grep -aE "√|×|✓|✗|Tests:|Suites:" /tmp/period-tz.log || echo "(لا ملخّص)"

      # حارسٌ للحارس: **كل مجسّ حيّ على القرص نُفِّذ في إحدى الخطوتين**.
      #
      # ⚠️ ويقرأ **القرص** لا مخرَج jest وحده — كنظيريه في هذا الملف. فالنمط
      #    المشتقّ يحمي من النسيان، وهذا العدّ يحمي من انزلاق النمط نفسه:
      #    ملفٌّ يُسمّى `*.live.test.ts` أو يقع خارج `--roots` يختفي **صامتاً**
      #    من التشغيل ويبقى على القرص، والوظيفة خضراء وقد نقص حارس.
      #
      # 📌 والمجموع لا التطابق مع سجلٍّ واحد: المجسّات موزَّعة على خطوتين
      #    (العامة · وقفل الفترة بمنطقتها). فأي ثالثةٍ تُضاف مستقبلاً تُضاف
      #    إلى الجمع صراحةً — ولا تمرّ بالسهو.
      - name: التحقق أن كل مجسّ حيّ نُفِّذ في إحدى الخطوتين
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          on_disk=$(find src -name '*.live.spec.ts' | wc -l)
          suites() {
            sed 's/\x1b\[[0-9;]*m//g' "$1" 2>/dev/null \
              | grep -aoE "Test Suites:.*[0-9]+ total" | grep -aoE "[0-9]+ total" \
              | grep -aoE "^[0-9]+" || echo 0
          }
          ran_general=$(suites /tmp/live.log)
          ran_tz=$(suites /tmp/period-tz.log)
          ran=$(( ran_general + ran_tz ))
          echo "على القرص: $on_disk · العامة: $ran_general · قفل الفترة: $ran_tz · المجموع: $ran"
          if [ "$on_disk" != "$ran" ]; then
            echo "::error::تفاوت: $on_disk مجسّاً حيّاً على القرص و$ran منفَّذ — مجسّ سقط خارج نطاق jest"
            find src -name '*.live.spec.ts' | sort
            exit 1
          fi
      #
      # `npm run test:e2e` لا استدعاء jest مباشرةً: السكربت يحمل
      # `--runInBand --forceExit` وهما قرارا المشروع لا تفصيلتان. وإعادة
      # كتابتهما هنا تعني نسخةً ثانية من القرار تفترق عن الأولى بصمت.
      #
      # ⚠️ `set -o pipefail` مع `tee`: صدفة Actions الافتراضية `bash -e` بلا
      # pipefail، فرمز خروج الأنبوب رمزُ `tee` — صفرٌ دائماً. بدونه تعود
      # الوظيفة خضراء ولو سقطت السبعة والسبعون كلها.
      #
      # و`if: always()` لا لتخفيف المنع — الخطوة تُسقط الوظيفة كما هي. بل
      # لئلا يحجب سقوطُ الخطوة السابقة نتيجةَ هذه: خطوةٌ تتوقّف عند أول فشل
      # تترك مجموعاتِ التكامل كلَّها **بلا نتيجة**، فيُقرأ الأحمر على أنه السجلّان وحدهما
      # ويُصلَح ما ليس معطوباً. سقوطان يُريان أصدق من واحدٍ يحجب الآخر.
      # ⚠️ **ولا رقمَ في الاسم** (`ق-٤٢٥`): كان «77 مجموعة» **والقرصُ ٩٩** —
      # **والحارسُ مشتقٌّ فلم يكذب، لكنّ الاسمَ تقادم**. **واسمٌ يحمل عدداً
      # يتقادم بلا حارس**، **والحذفُ أرخصُ من الاشتقاق**: اسمٌ بلا رقمٍ لا يتقادم.
      #
      # ⭐ **والخطوةُ مُشرَّحة** (`ق-٤٢٣` · `ق-٤٢٤`): كانت تُشغّل الكلَّ في عمليةٍ
      # واحدة **فبلغت حافّةَ الكومة** — خضراء بلا إضافة، **وحمراء بأيّ إضافة**.
      - name: اختبارات التكامل على قاعدة حيّة — مُشرَّحة (blocking)
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log

      # حارسٌ للحارس: عددُ ما نُفِّذ يطابق ما على القرص.
      #
      # ⚠️ يقرأ **القرص** لا مخرَج jest وحده. الوظيفة كلها وُلدت من عطلٍ من
      # هذه العائلة: استدعاءٌ يسمّي ملفّين بعينهما، فتبقى 92 مجموعة خارج
      # السير سنةً بلا أن يشتكي شيء. وعددٌ ناقص هنا يعني حارساً سقط خارج
      # نطاق jest — والوظيفة تبقى خضراء بدونه.
      # ⚠️ **ويُجمَع عبر الشرائح** (`ق-٤٢٤`): مع التشريح يطبع جيست سطرَ
      # `Test Suites:` **مرّةً لكل شريحة**، وكلٌّ يحمل نصيبَها وحدَه.
      # **فقراءةُ سطرٍ واحد تُعطي ربعَ العدد وتُسقط الحارسَ بحمرةٍ كاذبة**،
      # **وقراءةُ آخرِها تفعل مثلها**. فالمجموعُ هو المقياس.
      - name: التحقق أن كل مجموعة تكامل نُفِّذت فعلاً
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          on_disk=$(find test -name '*.e2e-spec.ts' | wc -l)
          ran=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log \
            | grep -aoE "Test Suites:.*[0-9]+ total" | grep -aoE "[0-9]+ total" | grep -aoE "^[0-9]+" \
            | awk '{s+=$1} END {print s+0}')
          echo "على القرص: $on_disk · نُفِّذ: $ran"
          if [ "$on_disk" != "$ran" ]; then
            echo "::error::تفاوت: $on_disk اختبار تكامل على القرص و$ran منفَّذ — حارسٌ سقط خارج نطاق jest"
            exit 1
          fi

      # ملخّص دائم في **كل** تشغيل. درسُ Playwright: رقمٌ مقروء في السجل
      # أرخص من أثرٍ يُنزَّل، وأصدق من استنتاجٍ من خلوّ `--log-failed`.
      - name: ملخّص خام (التكامل) + أسماء الساقط
        if: always()
        shell: bash
        run: |
          echo "──────── الملخّص ────────"
          grep -aE "Tests:|Test Suites:|Time:" /tmp/e2e.log || echo "(لا ملخّص)"
          echo ""
          echo "──────── المجموعات الساقطة ────────"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -aE "^(FAIL|  ●)" | head -80 || echo "(لا سقوط)"

      - name: سجل MinIO
        if: failure()
        run: docker logs minio 2>&1 | tail -30 || true

  # الاختبار ٧ — ترويسات التخزين، على nginx **الحقيقي** لا على خادم المعاينة.
  #
  # لماذا وظيفة مستقلة: الترويسات تخصّ صورة الإنتاج (`apps/web/Dockerfile` +
  # `docker/web-nginx.conf`)، وخادم معاينة vite لا يقدّمها أصلاً — فكان
  # `caching.spec.ts` مشروطاً بـ`E2E_BASE_URL` ومربوطاً بإجراءٍ يدوي قبل
  # النشر، أي أنه **لم يُنفَّذ في أي بيئة قط**. وحارسٌ لا يعمل ليس حارساً،
  # وهذا تحديداً الحارس الوحيد لإصلاح الصفحة البيضاء.
  #
  # ⛔ مانعة من أول يوم — بلا `continue-on-error`. درسُ 2026-08-12: وضع
  # الإبلاغ لم يُنقذ حارساً قط، بل أخفى ستة سقوطات وأنتج دمجاً على أخضرَ كاذب.
  nginx-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # سياق البناء هو جذر المستودع (الـDockerfile ينسخ package-lock والحزم).
      - name: بناء صورة الواجهة (nginx + الحزمة المبنية)
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:3000 -t mad-web:ci .

      - name: تشغيل الصورة وانتظار جاهزيتها
        run: |
          docker run -d --name mad-web -p 8080:80 mad-web:ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/; then echo "nginx جاهز بعد ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::الصورة لم تجهز خلال 30 ثانية"; docker logs mad-web; exit 1

      # 📉 **حدٌّ مقصود ومُعلَن:** عرضٌ واحد لا ثلاثة. ترويسات التخزين تخرج من
      # nginx مستقلةً عن مقاس النافذة تماماً، فثلاثة أعراض = ٣× كلفة بصفر
      # معلومة إضافية. ولا متصفح يُنزَّل: الثلاثة تستعمل `request` وحده لا
      # `page` — مُتحقَّق منه محلياً بتوجيه `PLAYWRIGHT_BROWSERS_PATH` إلى
      # مجلد فارغ، فمرّت الثلاثة. أي أن `playwright install` هدرٌ هنا.
      #
      # ولا API في هذه الوظيفة عمداً: `globalSetup` يكتشف ذلك ويكتب
      # `{hasApi:false}` بلا تسجيل منشأة — فلا أثر ولا حاجة لتنظيف.
      - name: الاختبار ٧ على nginx (blocking)
        shell: bash
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          set -o pipefail
          npm run test:e2e --workspace apps/web -- e2e/caching.spec.ts --project=desktop-1280 2>&1 | tee /tmp/cache.log

      # نفس درس حارس التخطّي الميت: تخطٍّ صامت هنا يترك المنعَ بلا معنى —
      # فالوظيفة كلها ثلاثة اختبارات، وتخطّيها يعني أن `E2E_BASE_URL` لم يصل.
      - name: التحقق أن الاختبار ٧ نُفِّذ فعلاً ولم يُتخطَّ
        if: always()
        shell: bash
        run: |
          if sed 's/\x1b\[[0-9;]*m//g' /tmp/cache.log 2>/dev/null | grep -aqE "^[[:space:]]*[0-9]+ skipped"; then
            echo "::error::الاختبار ٧ مُتخطّى رغم وجود nginx — E2E_BASE_URL لم يصل إلى playwright"
            docker logs mad-web || true
            exit 1
          fi
          grep -aE "^[[:space:]]*[0-9]+ (passed|failed|skipped)" /tmp/cache.log || echo "(لا ملخّص)"

      - name: سجل nginx
        if: failure()
        run: docker logs mad-web || true

  playwright:
    runs-on: ubuntu-latest

    # قاعدة بيانات حقيقية: اختبارات التخطيط تسجّل منشأة فعلية عبر الـAPI
    # (قرار المالك: العزل أهم من السرعة). وبدونها كانت تُتخطّى — أي أن السير
    # يمنع على ستة اختبارات ويترك الحارس الوحيد للتخطيط بلا تنفيذ.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mad_app
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: mad_app
        ports: ['5432:5432']
        # `-U mad_app` لا `pg_isready` مجرّداً: بلا مستخدمٍ صريح يتصل الفحص
        # بالمستخدم الافتراضي (root) فيطبع
        #   FATAL: role "root" does not exist
        # كل خمس ثوانٍ. لا يمنع شيئاً — الفحص يعتدّ بردّ الخادم لا بنجاح
        # الاتصال — لكنه يدفن سطور الفشل الحقيقية تحت ضجيج، وهو ما جعل
        # استخراج سبب سقوطٍ في السير متعذّراً.
        options: >-
          --health-cmd "pg_isready -U mad_app -d mad_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # كلمات مرور CI صريحةً في الملف عمداً: القاعدة تُخلق وتموت مع الوظيفة
      # ولا تُنشر على شبكة، فلا سرّ هنا يُحمى — ووضعها في secrets يوحي بأمانٍ
      # وهمي ويجعل السير غير قابل للتشغيل على نسخة مستنسخة.
      PGPASSWORD: ci_only_not_a_secret
      APP_DB_PASSWORD: ci_app_pass
      DATABASE_URL: postgresql://app_user:ci_app_pass@localhost:5432/mad_app?schema=public
      JWT_ACCESS_SECRET: ci-jwt-secret-not-used-outside-ci-0123456789
      DEV_SEED_PLATFORM_ADMIN_USERNAME: Arsan_admin
      DEV_SEED_PLATFORM_ADMIN_PASSWORD: CiAdminPass123!
      E2E_API_URL: http://localhost:3000
      # ⚠️ 4173 لا 5173 — ومنفذٌ خاطئ هنا يُسقط كل اختبار يمرّ بالدخول.
      #
      # الحادثة: كان غائباً، فعاد الـAPI إلى افتراضي `main.ts:35`
      # (`http://localhost:5173`) بينما Playwright يقدّم البناء على **4173**
      # (`playwright.config.ts:15`). فرفض CORS طلبَ الدخول، ولم يُركَّب
      # `.app-shell` قط، وسقطت الاختبارات بـ`TimeoutError` على **العروض
      # الثلاثة معاً** — وهو ما برّأ أ٣: عطلُ تخطيطٍ يمسّ 375 وحده.
      #
      # ولم يكن تباطؤاً: كل محاولة استغرقت المهلة بالضبط (20.5s ثم 45.0s بعد
      # رفعها)، ورفعُ المهلة لم يغيّر شيئاً — لم يصل الطلب أصلاً.
      WEB_ORIGIN: http://localhost:4173
      # NODE_ENV يبقى development عمداً: حارس أسرار الإنتاج
      # (production-secrets.ts) يرفض الإقلاع بقيم كهذه — وهو تصرّفه الصحيح.

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts

      # دور app_user: في الإنتاج ينشئه سكربت تهيئة مربوط بالحاوية، ولا مقابل
      # له في `services:` — فيُنشأ هنا يدوياً بنفس الخصائص. NOSUPERUSER
      # وNOBYPASSRLS شرطان لا تفصيل: الدور الخارق يتجاوز عزل الصفوف بصمت،
      # فاختبارٌ يعمل بدورٍ خارق لا يختبر العزل أصلاً.
      - name: إنشاء دور app_user (نظير docker/postgres-init-prod)
        run: |
          psql -h localhost -U mad_app -d mad_app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user WITH LOGIN PASSWORD 'ci_app_pass' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
          GRANT ALL PRIVILEGES ON DATABASE mad_app TO app_user;
          ALTER SCHEMA public OWNER TO app_user;
          SQL

      - name: prisma generate + migrate deploy
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # بذرة التطوير: تُنشئ مدير المنصة والقوالب العامة — ومدير المنصة لازم
      # لتنظيف منشآت الاختبار (DELETE /companies/:id). القاعدة تموت مع الوظيفة
      # فبياناتها التجريبية بلا أثر.
      - name: بذرة (مدير المنصة + القوالب)
        working-directory: apps/api
        run: npx prisma db seed

      - name: إقلاع الـAPI وانتظار جاهزيته
        working-directory: apps/api
        run: |
          npm run start > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/docs; then echo "API جاهز بعد ${i}0s"; exit 0; fi
            sleep 10
          done
          echo "::error::الـAPI لم يجهز خلال 600 ثانية"; tail -40 /tmp/api.log; exit 1

      # `npm exec --workspace` لا `npx --workspace`: الأخيرة ليست علماً في npx،
      # فتُفسَّر كوسيط لـplaywright ويُجلب ثنائيٌّ من ذاكرة npx بدل المثبَّت
      # محلياً — فينهار التشغيل بـERR_MODULE_NOT_FOUND عند حلّ @playwright/test.
      # (انكشف بمحاكاة السير محلياً قبل دفعه.)
      - run: npm exec --workspace apps/web -- playwright install --with-deps chromium

      # ⛔ تمنع الدمج **من اليوم** (قرار المالك 2026-08-12، مقدَّماً على
      # 2026-08-17 المخطَّط له). السبب واقعة لا مبدأ: بقيت `continue-on-error`
      # فسقطت ستة اختبارات في تشغيلين متتاليين، وظهرت الوظيفة **خضراء** في
      # الواجهة وفي `gh run view --log-failed` معاً — فدُمج فرعٌ على أساس
      # «أخضر» لا يعني إلا «لم يُمنع الدمج». حارسٌ لا يُرى سقوطه ليس حارساً.
      #
      # `tee` لا إعادة توجيه: المخرَج يبقى في السجل المباشر **و**يُحفظ لخطوة
      # الملخّص بعده.
      #
      # ⚠️ و`set -o pipefail` شرطُ صحّةٍ لا تجميل: صدفة Actions الافتراضية
      # `bash -e` **بلا pipefail**، فرمز خروج الأنبوب يكون رمز `tee` — وهو صفرٌ
      # دائماً. بدونه تبتلع هذه الخطوة سقوطَ playwright وتعود الوظيفة خضراء:
      # أي إعادةُ إنتاجٍ حرفية للعطل الذي حُذفت `continue-on-error` من أجله،
      # وبلبوسٍ أخفى.
      - name: playwright — 375/768/1280 (blocking)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e --workspace apps/web 2>&1 | tee /tmp/pw.log

      # حارسٌ للحارس: إن تُخطّي اختبارٌ رغم وجود قاعدة وAPI، فالسبب عطل في
      # الإقلاع لا غياب بنية — ويجب أن **يمنع**، لا أن يُقرأ نجاحاً.
      #
      # ⚠️ صياغةٌ أولى بحثت عن `"status":"skipped"` في `.last-run.json`، وهو
      # بحثٌ **لا يُطابق أبداً** (الملف لا يذكر المتخطّى قط) — فكان الحارس
      # ميتاً. فنُقل إلى مخرَج playwright نفسه.
      #
      # ⚠️ وصياغةٌ ثانية طابقت **أرقام أسطر ثابتة** في `layout.spec.ts`
      # (`:(43|50|56|72)`) — وهي حارسٌ **يُبطله أي تحرير في الملف الذي
      # يحرسه**: سطرٌ يُضاف في أعلاه — ولو تعليقاً — يُزيح الأربعة فيصمت
      # الحارس **ويبقى أخضر**. مُثبَتٌ بالعكس: بإضافة سطرٍ واحد لم يعد أيٌّ
      # من الأربعة اختباراً.
      #
      # فالحارس الآن سكربتٌ يقرأ **أسماء** الاختبارات من مصدرها ويشتقّ منه
      # أيَّها يُتوقّع على أيّ عرض — انظر `apps/web/e2e/assert-not-skipped.mjs`.
      # وهو أوسع من سابقه: يغطّي كل ملفات `e2e/` لا `layout` وحده.
      - name: التحقق أن الاختبارات نُفِّذت فعلاً ولم تُتخطَّ
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node apps/web/e2e/assert-not-skipped.mjs /tmp/pw.log apps/web/e2e || {
            tail -40 /tmp/api.log || true
            exit 1
          }
          tail -20 /tmp/api.log || true

      # ملخّص دائم في **كل** تشغيل — ناجحاً كان أم ساقطاً.
      #
      # هذه الخطوة (بأختها تحتها) هي التي كشفت أن «الأخضر» كان كاذباً؛ ولولاها
      # لبقينا نطارد شبحاً. فتبقى دائمة لا مؤقتة: رقمٌ مقروء في السجل أرخص من
      # أثرٍ يُنزَّل ويُفتح محلياً، وأصدق من استنتاجٍ من خلوّ `--log-failed`.
      - name: ملخّص Playwright (passed / failed / skipped)
        if: always()
        run: |
          echo "──────── ملخّص Playwright ────────"
          grep -aE "^[[:space:]]*[0-9]+ (passed|failed|skipped|flaky|interrupted|did not run)" /tmp/pw.log \
            || echo "(لا ملخّص — لم يصل التشغيل إلى نهايته أصلاً)"

      # سبب السقوط **في السجل نفسه** لا في أثرٍ يحتاج تنزيلاً.
      #
      # وُلدت هذه الخطوة من عجزٍ حقيقي: سقطت playwright في السير ولم يمكن
      # استخراج السطر، لأن واجهة GitHub تعرض سجل حاوية postgres لا خطوة
      # الاختبارات. فمن يقرأ النتيجة يرى «exit 1» بلا سبب — وتشخيصٌ يحتاج
      # تنزيل أثرٍ ثم فتحه محلياً ليس تشخيصاً متاحاً.
      - name: طباعة تفاصيل السقوط (اسم الاختبار ورسالته)
        if: always()
        run: |
          echo "──────── ملخّص التشغيل ────────"
          cat apps/web/test-results/.last-run.json 2>/dev/null || echo "(لا ملخّص)"
          echo ""
          echo "──────── سياق كل سقوط ────────"
          found=0
          for f in apps/web/test-results/*/error-context.md; do
            [ -e "$f" ] || continue
            found=1
            echo "═══ $f ═══"
            head -60 "$f"
            echo ""
          done
          [ "$found" = "0" ] && echo "(لا ملفات سياق — لم يسقط شيء أو لم يُكتب الأثر)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
