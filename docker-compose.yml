services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mad_app
      POSTGRES_PASSWORD: mad_app_dev_password
      POSTGRES_DB: mad_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mad_app -d mad_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 🔴 **من سجلّ صورٍ خاصٍّ بحساب المالك على GitHub، مثبَّتاً بالبصمة** (`ق-١٤٠٨`):
    #    توزيعُ MinIO المجانيّ غاب **ثانيةً** — Docker Hub ردّ السحبَ المجهول (`ق-٦٠٠`)،
    #    ثم `quay.io` صار يردّ `401` (2026-09-24 · `12:59Z`) و`dl.min.io` `410`. فنُسخت
    #    **الصورةُ المخزَّنة نفسُها** إلى `ghcr.io/arsant4x/minio` — **خاصّةً، واستعمالٌ داخليّ**.
    # 🔒 **والبصمةُ لا الوسم**: البصمةُ بصمةُ منصّة `linux/amd64` كما سُحبت من المصدر
    #    (`a1a8bd4a…`) — فالإصدارُ نفسُه بايتاً، والوسمُ للقراءة وحدَها. **وهي نسخةُ الإنتاج العاملة**.
    # ⚠️ **والسحبُ يحتاج دخولاً** (`docker login ghcr.io`) بصلاحية قراءة الحزم — `DEPLOY.md`.
    image: ghcr.io/arsant4x/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mad_app
      MINIO_ROOT_PASSWORD: mad_app_dev_password
    # Host ports are 9100/9101, not 9000/9001: Windows reserves 8973-9072 for
    # its dynamic port range (see `netsh interface ipv4 show excludedportrange
    # protocol=tcp`), so binding 9000 on the host fails outright. Inside the
    # container MinIO still listens on the standard 9000/9001.
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
